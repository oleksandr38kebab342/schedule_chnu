name: rozklad

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rozklad
      POSTGRES_USER: rozklad
      POSTGRES_PASSWORD: rozklad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rozklad -d rozklad"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rozklad:rozklad@db:5432/rozklad
      REDIS_URL: redis://cache:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-replace-me-before-deploy}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
